<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף לא נמצא — מסגרת</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBFAF6;color:#17211F;font-family:'Heebo','Segoe UI',system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-weight:900;font-size:36px;color:#4318C9;margin:28px 0 10px;letter-spacing:-.02em}
  p{color:#57655F;font-size:18px;margin:0 0 32px}
  a.btn{display:inline-block;background:linear-gradient(120deg,#5B2BE0,#8B66FF);color:#fff;font-weight:700;padding:15px 34px;border-radius:999px;text-decoration:none;font-size:17px;box-shadow:0 12px 44px -14px rgba(91,43,224,.45)}
</style>
</head>
<body>
<main>
  <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
    <rect x="9" y="9" width="78" height="78" rx="24" fill="none" stroke="#5B2BE0" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="70 30"/>
    <circle cx="15.5" cy="15.5" r="8" fill="#FFB020"/>
  </svg>
  <h1>הדף הזה יצא מהמסגרת</h1>
  <p>הכתובת שחיפשת לא קיימת — אבל הבית קרוב.</p>
  <a class="btn" href="./">חזרה לדף הבית</a>
</main>
</body>
</html>
